name: kind e2e

# The customer-shaped end-to-end test (hack/e2e/run-kind-e2e.sh): private
# org data pack from an htpasswd registry, pack-named recipe resolution,
# full install, validation, unsigned evidence publish, and the fail-closed
# negative test. Local infrastructure only — nothing external is written.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - Chart.yaml
      - values.yaml
      - "templates/**"
      - "hack/**"
      - .github/workflows/kind-e2e.yml

permissions:
  contents: read

concurrency:
  group: kind-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      # Install the kind binary only — the script creates its own cluster.
      - uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Run the e2e
        run: ./hack/e2e/run-kind-e2e.sh
