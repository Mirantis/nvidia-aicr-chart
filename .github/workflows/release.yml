name: Release

# Publish a chart release: `git tag v0.1.0 && git push --tags`.
#
# workflow_dispatch is accepted only when run against a tag ref — dispatching
# from a branch is rejected, so a release can never be cut from a moving branch
# and overwrite a published version.
#
# First run only: the package is created private. Flip it to public at
# https://github.com/orgs/<org>/packages/container/charts%2Fnvidia-aicr/settings
# or consumers (including k0rdent catalog CI) cannot pull it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      # Unconditional: a skipped guard on a non-tag ref would still package and
      # push, overwriting the published version with whatever is on that ref.
      - name: Resolve version and verify it matches the tag
        id: v
        run: |
          CHART="$(helm show chart . | awk '/^version:/ {print $2}')"
          case "${GITHUB_REF}" in
            refs/tags/v*)
              TAG="${GITHUB_REF_NAME#v}"
              if [ "$TAG" != "$CHART" ]; then
                echo "::error::tag v${TAG} does not match Chart.yaml version ${CHART}"
                exit 1
              fi
              ;;
            *)
              echo "::error::release must run from a vN.N.N tag (got ${GITHUB_REF})"
              exit 1
              ;;
          esac
          # ghcr rejects uppercase repository paths; org names are not
          # guaranteed lowercase (e.g. "Mirantis").
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${CHART}"                     >> "$GITHUB_OUTPUT"
          echo "registry=oci://ghcr.io/${OWNER}/charts" >> "$GITHUB_OUTPUT"
          echo "Releasing ${CHART} to oci://ghcr.io/${OWNER}/charts"

      # --strict + a valid criteria set, per CONTRIBUTING's dev loop: bare
      # `helm lint .` reports "0 chart(s) failed" even when the criteria
      # guard fails the render, so it cannot catch a broken template.
      - name: helm lint
        run: helm lint . --strict --set accelerator=h100 --kube-version 1.34.0

      - name: Verify render
        run: ./hack/verify-render.sh .

      - name: Package
        id: package
        run: |
          helm package . --destination ./dist
          echo "file=$(ls ./dist/*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Chart versions are immutable by contract: the k0rdent catalog pins an
      # exact version, so republishing it would swap chart bytes underneath a
      # consumer with no signal. Bump Chart.yaml instead.
      - name: Refuse to overwrite a published version
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHART_NAME="$(helm show chart . | awk '/^name:/ {print $2}')"
          REGISTRY="${{ steps.v.outputs.registry }}"
          VERSION="${{ steps.v.outputs.version }}"
          REPOSITORY="${REGISTRY#oci://ghcr.io/}/${CHART_NAME}"
          MANIFEST_URL="https://ghcr.io/v2/${REPOSITORY}/manifests/${VERSION}"
          TOKEN=""
          TOKEN_SOURCE=anonymous

          # Try GHCR's anonymous token flow first. A raw job token is not a
          # registry bearer: exchange it for a scoped pull token when required.
          if RESPONSE="$(curl -fsSL --retry 2 --retry-all-errors \
                --connect-timeout 10 --max-time 30 \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPOSITORY}:pull")"; then
            TOKEN="$(printf '%s' "$RESPONSE" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])' 2>/dev/null || true)"
          fi

          exchange_token() {
            local response token
            response="$(curl -fsS -u "${{ github.actor }}:${GHCR_TOKEN}" \
              --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPOSITORY}:pull")" || return
            token="$(printf '%s' "$response" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])' 2>/dev/null)" || return
            [ -n "$token" ] || return 1
            TOKEN="$token"
          }

          if [ -z "$TOKEN" ]; then
            if [ -z "$GHCR_TOKEN" ] || ! exchange_token; then
              echo "::error::could not obtain a GHCR pull token; refusing to proceed"
              exit 1
            fi
            TOKEN_SOURCE=exchanged
          fi

          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT
          check_manifest() {
            local bearer="$1" attempt code=""
            for attempt in 1 2 3; do
              code="$(curl -sS --connect-timeout 10 --max-time 30 \
                -o "$BODY" -w '%{http_code}' \
                -H "Authorization: Bearer ${bearer}" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.cncf.helm.config.v1+json' \
                "$MANIFEST_URL" || true)"
              case "$code" in 200|404) break ;; esac
              if [ "$attempt" -lt 3 ]; then sleep 2; fi
            done
            printf '%s' "${code:-000}"
          }

          CODE="$(check_manifest "$TOKEN")"
          if { [ "$CODE" = 401 ] || [ "$CODE" = 403 ]; } \
              && [ "$TOKEN_SOURCE" = anonymous ] && [ -n "$GHCR_TOKEN" ] \
              && exchange_token; then
            CODE="$(check_manifest "$TOKEN")"
          fi
          case "$CODE" in
            200)
              echo "::error::${CHART_NAME} ${VERSION} is already published — bump the chart version"
              exit 1
              ;;
            404)
              if ! grep -Eq '"code"[[:space:]]*:[[:space:]]*"(MANIFEST_UNKNOWN|NAME_UNKNOWN)"' "$BODY"; then
                echo "::error::GHCR manifest lookup at ${MANIFEST_URL} returned HTTP 404 with an unrecognized body; refusing to proceed"
                exit 1
              fi
              echo "version ${VERSION} is unpublished; proceeding"
              ;;
            *)
              echo "::error::GHCR manifest lookup returned HTTP ${CODE:-000} after retries; refusing to proceed"
              exit 1
              ;;
          esac

      - name: Push chart
        run: helm push "${{ steps.package.outputs.file }}" "${{ steps.v.outputs.registry }}"
