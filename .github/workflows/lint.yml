name: Lint

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      # --strict + a valid criteria set, per CONTRIBUTING's dev loop: bare
      # `helm lint .` reports "0 chart(s) failed" even when the criteria
      # guard fails the render, so it cannot catch a broken template.
      - name: helm lint
        run: helm lint . --strict --set accelerator=h100

      # Renders every conditional path and asserts on rendered VALUES.
      # Shared with the release workflow so a tag cannot publish a chart whose
      # branches were never rendered.
      - name: Verify render
        run: ./hack/verify-render.sh .

      - name: Package
        run: helm package .
