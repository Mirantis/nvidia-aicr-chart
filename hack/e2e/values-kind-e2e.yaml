# Values for the kind e2e (hack/e2e/run-kind-e2e.sh) — LAB VALUES.
#
# This exercises the full customer path against in-cluster infrastructure:
# a private (htpasswd) plain-HTTP registry serving both the org data pack
# and the evidence push. Production values differ in exactly three ways:
# a TLS registry (drop the *PlainHTTP knobs), a real robot-account secret,
# and mode: signed or an out-of-cluster signing leg.
#
# The pack (hack/e2e/acme-aicr-pack) registers service=acme, so the recipe
# is pack-named: without the pack, h100+training resolves nothing.
service: acme
accelerator: h100
intent: training

dataPack: "registry.registry.svc:5000/acme-aicr-pack:1.0.0"
dataPackSecret: "acme-registry-cred"
dataPackPlainHTTP: true

validate:
  enabled: true
  phases: [deployment]
  emitEvidence: true
  publish:
    enabled: true
    mode: unsigned                 # signed needs a Fulcio-trusted issuer; see
                                   # .github/workflows/signed-evidence-e2e.yml
    ref: registry.registry.svc:5000/aicr-evidence
    registrySecret: "acme-registry-cred"
    plainHTTP: true
