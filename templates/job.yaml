{{- if kindIs "string" .Values.aicrSha256 }}
{{- fail "aicrSha256 is now a per-architecture map, e.g. aicrSha256: { amd64: \"<sha>\", arm64: \"<sha>\" }. Move your value under the key matching aicrArch." }}
{{- end }}
{{- /* compact drops empty entries: `--set validate.phases={}` yields a
       single-element list containing "", which is truthy but produces no
       --phase flags, making aicr run every phase including performance. */}}
{{- $phases := compact (.Values.validate.phases | default list) }}
{{- $packSecret := include "nvidia-aicr.packSecretName" . }}
{{- if and .Values.validate.enabled (not $phases) }}
{{- fail "validate.enabled requires at least one non-empty entry in validate.phases (an empty list would make aicr run ALL phases, including performance)" }}
{{- end }}
{{- /* Criteria guard: the old default (a100 + service=any) silently resolved
       the THINNEST recipe in the embedded catalog. Escapes are exact:
       a stated accelerator; a dataPack (the org pack owns criteria
       completeness); or a concrete service plus intent (accelerator-less
       leaves like bcm+inference exist upstream). service "any" and its
       documented aliases (self-managed, self, vanilla) are NOT concrete —
       aicr rejects any+intent outright. */}}
{{- if eq .Values.accelerator "any" }}
{{- fail "accelerator: \"any\" is not a value — aicr rejects it as \"no criteria provided\". Leave accelerator empty and satisfy the criteria guard another way (dataPack, or concrete service plus intent), or state a real accelerator" }}
{{- end }}
{{- $svcConcrete := and .Values.service (not (has .Values.service (list "any" "self-managed" "self" "vanilla"))) }}
{{- if and (not .Values.accelerator) (not .Values.dataPack) (not (and $svcConcrete .Values.intent)) }}
{{- fail "no recipe criteria stated. Set accelerator (e.g. --set accelerator=h100), or set dataPack so your org pack owns criteria, or set a concrete service plus intent (e.g. service=bcm,intent=inference). Check valid combinations with: aicr recipe list --gpu <accelerator>" }}
{{- end }}
{{- /* Assert-only runs must actually assert something. */}}
{{- if and (not .Values.deploy.enabled) (not .Values.validate.enabled) }}
{{- fail "deploy.enabled=false requires validate.enabled=true: a Job that neither deploys nor validates is a no-op. Enable validation for an assert-only run, or set deploy.enabled=true" }}
{{- end }}
{{- $pub := .Values.validate.publish | default dict }}
{{- if $pub.enabled }}
{{- if not .Values.validate.enabled }}
{{- fail "validate.publish.enabled requires validate.enabled: publishing needs a validation run to produce the evidence bundle" }}
{{- end }}
{{- if not .Values.validate.emitEvidence }}
{{- fail "validate.publish.enabled requires validate.emitEvidence: without --emit-attestation there is no bundle to publish" }}
{{- end }}
{{- if not (has $pub.mode (list "signed" "unsigned")) }}
{{- fail (printf "validate.publish.mode must be \"signed\" or \"unsigned\", got %q" ($pub.mode | toString)) }}
{{- end }}
{{- if not $pub.ref }}
{{- fail "validate.publish.ref is required when publish is enabled: aicr evidence publish needs --push <oci-ref>, e.g. ghcr.io/myorg/aicr-evidence" }}
{{- end }}
{{- if and (eq $pub.mode "signed") (not ($pub.identityTokenSecret | default dict).name) }}
{{- fail "validate.publish.mode=signed requires validate.publish.identityTokenSecret.name (an existing Secret holding a short-lived OIDC token) — or use mode=unsigned and sign later from a trusted host with `aicr evidence sign <pointer> --relocate`" }}
{{- end }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  # Revision-suffixed: Job specs are immutable, so a helm upgrade with changed
  # values creates a fresh Job instead of erroring. Finished Jobs are reaped by
  # ttlSecondsAfterFinished.
  #
  # Caveat: ttlSecondsAfterFinished only applies once a Job has FINISHED.
  # Upgrading while an install is still running makes Helm delete the previous
  # revision's Job (it is absent from the new manifest), which SIGKILLs
  # deploy.sh mid-run and can leave downstream releases in
  # pending-install/pending-upgrade. Let an install finish before upgrading.
  name: {{ .Release.Name }}-install-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nvidia-aicr
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-aicr
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-installer
      restartPolicy: Never
      {{- with .Values.job.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.job.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.job.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.job.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      # The ServiceAccount is bound to cluster-admin (AICR installs CRDs,
      # namespaces, and RBAC), so the pod itself runs locked down: nonroot,
      # read-only root filesystem, all work under an emptyDir at /tmp.
      # UID 65532 matches upstream's own manifests (ghcr.io/nvidia/aicr* run
      # as ko's nonroot user).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.dataPack }}
      initContainers:
        # Pull the AICR --data extension pack (OCI artifact) into the shared
        # volume. With dataPackSecret set, oras authenticates from the mounted
        # dockerconfigjson; a bad credential fails the initContainer — fail
        # closed, never a silent fallback to anonymous.
        - name: data-pack
          image: {{ .Values.orasImage | quote }}
          args: ["pull", {{ .Values.dataPack | quote }}, "-o", "/data/pack"{{- if $packSecret }}, "--registry-config", "/pack-auth/config.json"{{- end }}{{- if .Values.dataPackPlainHTTP }}, "--plain-http"{{- end }}{{- if .Values.dataPackInsecureTLS }}, "--insecure"{{- end }}]
          env:
            - name: HOME          # oras writes config under $HOME; rootfs is read-only
              value: /data/pack
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pack
              mountPath: /data/pack
            # oras stages downloaded blobs via temp files in /tmp before
            # placing them in -o; with readOnlyRootFilesystem it needs a
            # writable mount there (found by the kind e2e: "open
            # /tmp/oras_file_...: read-only file system").
            - name: pack-tmp
              mountPath: /tmp
            {{- if $packSecret }}
            - name: pack-auth
              mountPath: /pack-auth
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: aicr
          image: {{ .Values.runtimeImage | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.job.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /tmp
            {{- if .Values.dataPack }}
            - name: pack
              mountPath: /data/pack
              readOnly: true
            {{- end }}
            {{- if and $pub.enabled $pub.registrySecret }}
            - name: publish-auth
              mountPath: /publish-auth
              readOnly: true
            {{- end }}
          env:
            # helm/kubectl/aicr write caches and config under $HOME; point it
            # at the writable emptyDir since the root filesystem is read-only.
            - name: HOME
              value: /tmp
            - name: AICR_VERSION
              value: {{ .Values.aicrVersion | quote }}
            - name: AICR_ARCH
              value: {{ .Values.aicrArch | quote }}
            {{- /* Arch-keyed so switching aicrArch can never check a tarball
                   against another architecture's hash. Empty => strict pin
                   skipped; the checksums-file verification still runs. */}}
            - name: AICR_SHA256
              value: {{ get (.Values.aicrSha256 | default dict) .Values.aicrArch | default "" | quote }}
            - name: ACCELERATOR
              value: {{ .Values.accelerator | quote }}
            - name: INTENT
              value: {{ .Values.intent | quote }}
            - name: OS
              value: {{ .Values.os | quote }}
            - name: PLATFORM
              value: {{ .Values.platform | quote }}
            - name: SERVICE
              value: {{ .Values.service | quote }}
            - name: STORAGE_CLASS
              value: {{ .Values.storageClass | quote }}
            - name: RECIPE_FLAGS
              value: {{ .Values.recipeFlags | quote }}
            - name: BUNDLE_FLAGS
              value: {{ .Values.bundleFlags | quote }}
            {{- /* Booleans render via the nvidia-aicr.bool helper (see
                   _helpers.tpl for why truthiness, not `| quote`). */}}
            - name: ENV_K0S_CONTAINERD
              value: {{ include "nvidia-aicr.bool" .Values.environment.k0sContainerd }}
            - name: ENV_PREINSTALLED_DRIVER
              value: {{ include "nvidia-aicr.bool" .Values.environment.preinstalledDriver }}
            - name: DEPLOY_ENABLED
              value: {{ include "nvidia-aicr.bool" .Values.deploy.enabled }}
            - name: DEPLOY_FLAGS
              value: {{ .Values.deployFlags | quote }}
            - name: DATA_PACK
              value: {{ .Values.dataPack | quote }}
            - name: VALIDATE_ENABLED
              value: {{ include "nvidia-aicr.bool" .Values.validate.enabled }}
            - name: VALIDATE_PHASES
              value: {{ join " " $phases | quote }}
            - name: VALIDATE_FAIL_ON_ERROR
              value: {{ include "nvidia-aicr.bool" .Values.validate.failOnError }}
            - name: RESULT_CM
              value: {{ .Values.validate.resultConfigMap | quote }}
            - name: EMIT_EVIDENCE
              value: {{ include "nvidia-aicr.bool" .Values.validate.emitEvidence }}
            - name: EVIDENCE_CM
              value: {{ .Values.validate.evidenceConfigMap | quote }}
            - name: RECIPE_CM
              value: {{ .Values.recipeConfigMap | default "" | quote }}
            - name: PUBLISH_ENABLED
              value: {{ include "nvidia-aicr.bool" $pub.enabled }}
            - name: PUBLISH_MODE
              value: {{ $pub.mode | default "signed" | quote }}
            - name: PUBLISH_REF
              value: {{ $pub.ref | default "" | quote }}
            - name: PUBLISH_FAIL_ON_ERROR
              value: {{ include "nvidia-aicr.bool" $pub.failOnError }}
            - name: PUBLISH_INSECURE_TLS
              value: {{ include "nvidia-aicr.bool" $pub.insecureTLS }}
            - name: PUBLISH_PLAIN_HTTP
              value: {{ include "nvidia-aicr.bool" $pub.plainHTTP }}
            {{- /* Render-time decision, not a runtime dir probe: set exactly
                   when registrySecret mounts /publish-auth. */}}
            - name: PUBLISH_DOCKER_CONFIG
              value: {{ if and $pub.enabled $pub.registrySecret }}"/publish-auth"{{ else }}""{{ end }}
            {{- if and $pub.enabled (eq ($pub.mode | default "signed") "signed") }}
            {{- /* Present ONLY in signed mode — absent, not empty, in unsigned
                   mode, so an unsigned run can never pick up a stale identity. */}}
            - name: COSIGN_IDENTITY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $pub.identityTokenSecret.name | quote }}
                  key: {{ $pub.identityTokenSecret.key | default "token" | quote }}
            {{- end }}
            - name: VALIDATE_FLAGS
              value: {{ .Values.validateFlags | default "" | quote }}
            - name: RESULT_NS
              value: {{ .Release.Namespace | quote }}
            {{- with .Values.job.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # Single ConfigMap payload budget for every capture (recipe,
              # evidence). ~900KiB: client-side apply caps around 1MiB.
              CM_BUDGET=921600
              echo "=== AICR install Job starting ==="
              echo "Version=${AICR_VERSION}  Arch=${AICR_ARCH}"
              echo "Recipe inputs: service=${SERVICE} accelerator=${ACCELERATOR} os=${OS} intent=${INTENT} platform=${PLATFORM}"

              cd /tmp
              AICR_VERSION="v${AICR_VERSION#v}"   # tolerate an un-prefixed version value
              TARBALL="aicr_${AICR_VERSION#v}_linux_${AICR_ARCH}.tar.gz"
              BASE_URL="https://github.com/NVIDIA/aicr/releases/download/${AICR_VERSION}"
              echo "=== Downloading aicr ${AICR_VERSION} ==="
              echo "URL: ${BASE_URL}/${TARBALL}"
              curl -fsSL -o "${TARBALL}" "${BASE_URL}/${TARBALL}"
              curl -fsSL -o aicr_checksums.txt "${BASE_URL}/aicr_checksums.txt"

              echo "=== Verifying checksum ==="
              # Fail closed: grep finds the tarball's line or the pipeline dies.
              grep " ${TARBALL}\$" aicr_checksums.txt | sha256sum -c -
              # Optional strict pin: anchors trust in reviewed chart values
              # rather than release assets (set aicrSha256.<arch>).
              if [ -n "${AICR_SHA256}" ]; then
                echo "${AICR_SHA256}  ${TARBALL}" | sha256sum -c -
              fi

              tar -xzf "${TARBALL}"
              chmod +x ./aicr
              ./aicr --version

              # --data pack (pulled by the initContainer when configured)
              DATA_ARGS=()
              if [ -n "${DATA_PACK}" ]; then
                DATA_ARGS+=(--data /data/pack)
                echo "Using --data pack: ${DATA_PACK}"
              fi

              echo "=== Generating recipe ==="
              # Empty criteria value => flag omitted: aicr then uses its
              # detected/any value for that dimension. Recipe overlays rarely
              # define every dimension (e.g. the kind overlays are
              # os-agnostic), and a flag naming a dimension the matching
              # overlays don't provide fails resolution outright.
              RECIPE_ARGS=(--output ./recipe.yaml)
              [ -n "${SERVICE}" ]     && RECIPE_ARGS+=(--service "${SERVICE}")
              [ -n "${ACCELERATOR}" ] && RECIPE_ARGS+=(--accelerator "${ACCELERATOR}")
              [ -n "${OS}" ]          && RECIPE_ARGS+=(--os "${OS}")
              [ -n "${INTENT}" ]      && RECIPE_ARGS+=(--intent "${INTENT}")
              [ -n "${PLATFORM}" ]    && RECIPE_ARGS+=(--platform "${PLATFORM}")
              # RECIPE_FLAGS/BUNDLE_FLAGS/DEPLOY_FLAGS are intentionally
              # word-split: freeform passthrough for extra CLI flags.
              # tee'd so the resolver's own completion line (component count
              # and names) can be captured; pipefail keeps failure fatal.
              ./aicr recipe "${RECIPE_ARGS[@]}" "${DATA_ARGS[@]}" ${RECIPE_FLAGS} 2>&1 | tee ./recipe.log
              echo "Recipe size: $(wc -l < ./recipe.yaml) lines"

              # Resolved-recipe visibility: under-specified criteria resolve a
              # THINNER stack with exit 0 and no warning. The captured summary
              # is how an operator audits what actually resolved.
              if [ -n "${RECIPE_CM}" ]; then
                {
                  echo "criteria: service=${SERVICE} accelerator=${ACCELERATOR} os=${OS} intent=${INTENT} platform=${PLATFORM}"
                  [ -n "${RECIPE_FLAGS}" ] && echo "recipeFlags: ${RECIPE_FLAGS}"
                  [ -n "${DATA_PACK}" ]    && echo "dataPack: ${DATA_PACK}"
                  grep -o "recipe generation completed.*" ./recipe.log || true
                } > ./summary.txt
                RECIPE_CM_ARGS=(--from-file=summary.txt=./summary.txt)
                if [ "$(wc -c < ./recipe.yaml)" -lt "${CM_BUDGET}" ]; then
                  RECIPE_CM_ARGS+=(--from-file=recipe.yaml=./recipe.yaml)
                else
                  echo "WARN: recipe.yaml exceeds the ConfigMap budget; capturing summary only"
                fi
                # Advisory by design (spec: "report-only" visibility): a capture
                # failure must never abort an install that would otherwise
                # succeed — this runs BEFORE deploy.sh.
                if kubectl create configmap "${RECIPE_CM}" -n "${RESULT_NS}" \
                  "${RECIPE_CM_ARGS[@]}" \
                  --dry-run=client -o yaml | kubectl apply --server-side --force-conflicts -f -; then
                  echo "Resolved recipe written to configmap ${RESULT_NS}/${RECIPE_CM}"
                else
                  echo "WARN: recipe capture failed (continuing; visibility is advisory)"
                fi
              fi

              if [ "${DEPLOY_ENABLED}" != "true" ]; then
                echo "=== Skipping deploy (deploy.enabled=false): assert-only run ==="
              else
              echo "=== Generating bundle ==="
              BUNDLE_ARGS=(--recipe ./recipe.yaml --deployer helm --output ./bundles)
              if [ -n "${STORAGE_CLASS}" ]; then
                BUNDLE_ARGS+=(--storage-class "${STORAGE_CLASS}")
              fi
              # Environment profile (values.environment.*), applied before
              # BUNDLE_FLAGS so operator-supplied flags win. Note --set is
              # scalar-only in aicr, hence --set-json for the toolkit env list.
              PROFILE_ARGS=()
              if [ "${ENV_PREINSTALLED_DRIVER}" = "true" ]; then
                PROFILE_ARGS+=(--set gpuoperator:driver.enabled=false)
                PROFILE_ARGS+=(--set dradriver:nvidiaDriverRoot=/)
                # aicr >= v0.19: a host-provided driver leaves no driver pod
                # for NVSentinel's labeler to observe; without this flag
                # `aicr bundle` fails closed (v0.20.0) and several NVSentinel
                # DaemonSets would otherwise come up with 0 desired pods.
                # Accepted (and needed for coherence) on the pinned version;
                # also accepted by v0.18.0. Verified 2026-08-30.
                PROFILE_ARGS+=(--set nv-sentinel:labeler.assumeDriverInstalled=true)
                echo "profile: preinstalled driver (gpu-operator driver off, DRA root /, nvsentinel labeler assumes driver)"
              fi
              if [ "${ENV_K0S_CONTAINERD}" = "true" ]; then
                PROFILE_ARGS+=(--set-json 'gpuoperator:toolkit.env=[{"name":"CONTAINERD_CONFIG","value":"/etc/k0s/containerd.d/nvidia.toml"},{"name":"CONTAINERD_SOCKET","value":"/run/k0s/containerd.sock"},{"name":"CONTAINERD_RUNTIME_CLASS","value":"nvidia"}]')
                echo "profile: k0s containerd (toolkit -> /run/k0s/containerd.sock)"
              fi
              ./aicr bundle "${BUNDLE_ARGS[@]}" "${DATA_ARGS[@]}" "${PROFILE_ARGS[@]}" ${BUNDLE_FLAGS}
              ls -la ./bundles/

              echo "=== Verifying bundle integrity ==="
              # Upstream's canonical flow is `aicr verify . && ./deploy.sh`.
              # In-Job bundles are created without --attest, so the achievable
              # trust level is "unverified": a closed-world checksum gate, not
              # provenance — but it fail-closes on any file added, removed, or
              # modified between bundle and execution, fully offline.
              # Verified 2026-09-01 (v0.20.0): clean bundle passes exit 0;
              # tampered deploy.sh fails exit 4. Exists on v0.18.0 too.
              #
              # Handled explicitly rather than left to `set -e`: a bare
              # non-zero exit here would fail the Job with no line saying
              # WHY, and "install failed" with no reason is exactly what
              # every other failure path in this script exists to avoid.
              # aicr's own exit code is preserved (4 = integrity failure).
              vrc=0
              ./aicr verify ./bundles || vrc=$?
              if [ "${vrc}" -ne 0 ]; then
                echo "=== AICR install FAILED (aicr verify exit ${vrc}: the bundle changed between generation and execution, or its checksums.txt does not match) ==="
                exit "${vrc}"
              fi

              echo "=== Running deploy.sh ==="
              # deploy.sh semantics differ by aicr version (both verified
              # against the release artifacts — house rule 2):
              #   v0.18.0: NEVER exits non-zero on component failures; it
              #            only prints "Deployment completed with failures".
              #   v0.20.0: exits 1 on the first component failure when
              #            --best-effort is absent; WITH --best-effort it
              #            still exits 0 and prints the same report line
              #            (now suffixed "(--best-effort): <components>").
              # Handle both: a non-zero exit fails the Job with context, and
              # the report line is still detected ourselves — so on either
              # version a partial install can never masquerade as success.
              rc=0
              ( cd ./bundles && bash ./deploy.sh ${DEPLOY_FLAGS} ) 2>&1 | tee ./deploy.log || rc=$?
              if [ "${rc}" -ne 0 ]; then
                # Preserve deploy.sh's exit code (like the validate/publish
                # paths): the Job exit code is a documented status surface,
                # and flattening to 1 would erase e.g. bash's 126/127 or any
                # future distinct upstream code.
                echo "=== AICR install FAILED (deploy.sh exit ${rc}) ==="
                exit "${rc}"
              fi
              if grep -q "Deployment completed with failures" ./deploy.log; then
                echo "WARN: deploy.sh reported component failures (see log above)"
                case " ${DEPLOY_FLAGS} " in
                  *" --best-effort "*) echo "--best-effort set: continuing past component failures" ;;
                  *) echo "=== AICR install FAILED (component failures without --best-effort) ==="; exit 1 ;;
                esac
              fi
              echo "=== AICR install complete ==="
              fi

              if [ "${VALIDATE_ENABLED}" = "true" ]; then
                cd /tmp
                echo "=== Validating (phases: ${VALIDATE_PHASES}) ==="
                PHASE_ARGS=()
                for p in ${VALIDATE_PHASES}; do PHASE_ARGS+=(--phase "$p"); done
                EVIDENCE_ARGS=()
                if [ "${EMIT_EVIDENCE}" = "true" ]; then
                  EVIDENCE_ARGS+=(--emit-attestation ./evidence)
                fi
                rc=0
                # VALIDATE_FLAGS is intentionally word-split, like its recipe/
                # bundle/deploy siblings: freeform passthrough for validate
                # flags (--namespace, --image-pull-secret, --node-selector...).
                ./aicr validate --recipe ./recipe.yaml "${PHASE_ARGS[@]}" \
                  "${DATA_ARGS[@]}" "${EVIDENCE_ARGS[@]}" \
                  --output ./ctrf.json ${VALIDATE_FLAGS} || rc=$?
                echo "aicr validate exit=${rc}"
                # Upstream exit-code semantics, so the log is self-explaining:
                case "${rc}" in
                  0) ;;
                  2) echo "  (exit 2: invalid input or readiness pre-flight failed — no validators ran)" ;;
                  5) echo "  (exit 5: CLI-layer timeout before a check ran)" ;;
                  8) echo "  (exit 8: one or more checks failed or were inconclusive — fails closed)" ;;
                  *) echo "  (unexpected validate exit code)" ;;
                esac

                # Capture the verdict UNCONDITIONALLY (pass or fail): aicr's
                # own per-phase CTRF ConfigMaps are removed at its run cleanup.
                if [ -f ./ctrf.json ]; then
                  # --server-side: client-side apply stores the full object in
                  # the last-applied annotation, capping payloads at ~256KiB.
                  kubectl create configmap "${RESULT_CM}" -n "${RESULT_NS}" \
                    --from-file=ctrf.json=./ctrf.json \
                    --dry-run=client -o yaml | kubectl apply --server-side --force-conflicts -f -
                  echo "CTRF verdict written to configmap ${RESULT_NS}/${RESULT_CM}"
                else
                  echo "WARN: validate produced no ctrf.json (exit=${rc})"
                fi
                # Publish BEFORE the evidence capture: `aicr evidence publish`
                # writes pointer.yaml into the bundle directory, so capturing
                # afterwards archives the bundle together with its locator.
                prc=0
                if [ "${PUBLISH_ENABLED}" = "true" ]; then
                  if [ -d ./evidence ]; then
                    echo "=== Publishing evidence (mode: ${PUBLISH_MODE}) ==="
                    PUB_ARGS=(--push "${PUBLISH_REF}" --yes)
                    [ "${PUBLISH_MODE}" = "unsigned" ]     && PUB_ARGS+=(--no-sign)
                    [ "${PUBLISH_INSECURE_TLS}" = "true" ] && PUB_ARGS+=(--insecure-tls)
                    [ "${PUBLISH_PLAIN_HTTP}" = "true" ]   && PUB_ARGS+=(--plain-http)
                    # DOCKER_CONFIG is scoped to this one invocation so the
                    # push credential can never leak into deploy.sh's helm
                    # pulls. ${VAR:+...} expands to a single KEY=VALUE word
                    # when set, to nothing when empty — one invocation, no
                    # duplicated command to drift.
                    env ${PUBLISH_DOCKER_CONFIG:+DOCKER_CONFIG="${PUBLISH_DOCKER_CONFIG}"} \
                      ./aicr evidence publish ./evidence "${PUB_ARGS[@]}" || prc=$?
                    echo "evidence publish exit=${prc}"
                  else
                    echo "WARN: publish enabled but validate emitted no ./evidence directory"
                    prc=1
                  fi
                fi

                if [ "${EMIT_EVIDENCE}" = "true" ] && [ -d ./evidence ]; then
                  tar czf ./evidence.tgz -C ./evidence .
                  SIZE=$(wc -c < ./evidence.tgz)
                  EVIDENCE_CM_ARGS=()
                  if [ "${SIZE}" -lt "${CM_BUDGET}" ]; then
                    EVIDENCE_CM_ARGS+=(--from-file=evidence.tgz=./evidence.tgz)
                  elif [ -f ./evidence/pointer.yaml ]; then
                    echo "WARN: evidence bundle ${SIZE} bytes exceeds the ConfigMap budget; capturing pointer only"
                  else
                    echo "WARN: evidence bundle ${SIZE} bytes exceeds the ConfigMap budget; not stored"
                  fi
                  # The pointer is the locator a verifier needs; captured as
                  # its own plaintext key whenever publish produced one.
                  [ -f ./evidence/pointer.yaml ] && EVIDENCE_CM_ARGS+=(--from-file=pointer.yaml=./evidence/pointer.yaml)
                  if [ "${#EVIDENCE_CM_ARGS[@]}" -gt 0 ]; then
                    kubectl create configmap "${EVIDENCE_CM}" -n "${RESULT_NS}" \
                      "${EVIDENCE_CM_ARGS[@]}" \
                      --dry-run=client -o yaml | kubectl apply --server-side --force-conflicts -f -
                    echo "Evidence artifacts written to configmap ${RESULT_NS}/${EVIDENCE_CM}"
                  fi
                fi
                if [ "${rc}" -ne 0 ] && [ "${VALIDATE_FAIL_ON_ERROR}" = "true" ]; then
                  echo "=== Validation FAILED (exit ${rc}) ==="
                  exit "${rc}"
                fi
                if [ "${prc}" -ne 0 ] && [ "${PUBLISH_FAIL_ON_ERROR}" = "true" ]; then
                  echo "=== Evidence publish FAILED (exit ${prc}) ==="
                  exit "${prc}"
                fi
              fi
              echo "=== AICR Job complete ==="
      volumes:
        - name: work
          emptyDir: {}
        {{- if .Values.dataPack }}
        - name: pack
          emptyDir: {}
        - name: pack-tmp
          emptyDir: {}
        {{- end }}
        {{- if and .Values.dataPack $packSecret }}
        - name: pack-auth
          secret:
            secretName: {{ $packSecret | quote }}
            items:
              - key: .dockerconfigjson
                path: config.json
            # Group-readable (0440), not 0400: secret files are root-owned and
            # the container reads them as uid 65532 via fsGroup.
            defaultMode: 0440
        {{- end }}
        {{- if and $pub.enabled $pub.registrySecret }}
        - name: publish-auth
          secret:
            secretName: {{ $pub.registrySecret | quote }}
            items:
              - key: .dockerconfigjson
                path: config.json
            defaultMode: 0440
        {{- end }}
