apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-installer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nvidia-aicr
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # Namespace-qualified: this object is cluster-scoped, so two releases of the
  # same name in different namespaces would otherwise collide on install, and
  # uninstalling either would strip cluster-admin from the survivor's SA.
  name: {{ printf "%s-%s-installer" .Release.Namespace .Release.Name | trunc 253 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: nvidia-aicr
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-installer
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
