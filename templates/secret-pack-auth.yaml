{{- /* Chart-managed pack-pull Secret — rendered only on explicit opt-in
       (dataPackAuth.dockerconfigjson non-empty). The default contract is
       unchanged: the chart never creates dataPackSecret. `| default dict`
       guards `--set dataPackAuth=null`, which would otherwise nil-deref on
       the `.dockerconfigjson` lookup below.

       Both the render condition and the object NAME come from
       nvidia-aicr.packSecretName, the same helper job.yaml uses to decide
       what to mount: spelling the name out here too would let the two drift,
       and a drifted name is invisible at render time — the Job would mount a
       Secret that does not exist and the pod would hang in
       ContainerCreating. The helper returns a name only for the two valid
       configurations and fails the render for the rest, so reaching it also
       re-runs the mutual-exclusion / requires-dataPack guards before the
       `.dockerconfigjson` lookup below (which is why a non-map dataPackAuth
       reports the helper's message, not a raw field-evaluation error). */}}
{{- $dataPackAuth := .Values.dataPackAuth | default dict }}
{{- $packSecret := include "nvidia-aicr.packSecretName" . }}
{{- if and $packSecret (not .Values.dataPackSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $packSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nvidia-aicr
    app.kubernetes.io/instance: {{ .Release.Name }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $dataPackAuth.dockerconfigjson | quote }}
{{- end }}
