# Landing the registry Secret on every fleet child — k0rdent pattern.
#
# The chart never creates dataPackSecret (fail-closed by design), which on a
# fleet means every child a MultiClusterService matches needs the
# dockerconfigjson Secret pre-created in the release namespace ON THAT
# CHILD. kcm bundles Sveltos, and Sveltos distributes resources referenced
# by a ClusterProfile's policyRefs to every matched cluster — so one Secret
# on the management cluster serves the whole fleet, and rotation is one
# `kubectl apply`. The same dockerconfigjson covers all three consumers
# (pack pull, evidence publish, validator image pulls — see README
# "Private validator images").
#
# 1) Wrap the child-cluster manifests in a management-cluster Secret of
#    type addons.projectsveltos.io/cluster-profile (Sveltos applies the
#    Secret's CONTENTS, so the wrapper holds manifests, not credentials
#    directly). The Namespace rides along because Sveltos applies these
#    before the MultiClusterService's helm install creates it:
#
#    kubectl create secret docker-registry aicr-pack-pull -n nvidia-aicr \
#      --docker-server=ghcr.io --docker-username=<user> --docker-password=<token> \
#      --dry-run=client -o yaml > /tmp/aicr-child-secret.yaml
#    printf 'apiVersion: v1\nkind: Namespace\nmetadata:\n  name: nvidia-aicr\n---\n' \
#      | cat - /tmp/aicr-child-secret.yaml > /tmp/aicr-child-manifests.yaml
#    kubectl create secret generic aicr-pack-pull-src -n kcm-system \
#      --type=addons.projectsveltos.io/cluster-profile \
#      --from-file=manifests.yaml=/tmp/aicr-child-manifests.yaml
#
# 2) Apply this ClusterProfile. Its selector must match the SAME labels your
#    MultiClusterService selects on, and it must exist BEFORE clusters get
#    that label: Sveltos and the MCS converge independently, and a Job pod
#    that starts before the Secret lands burns one of its two attempts
#    (job.backoffLimit defaults to 1, restartPolicy Never). For cold-start
#    insurance set job.backoffLimit: 3 in the MCS values. For a hard
#    ordering guarantee instead, deliver the Secret from a first
#    MultiClusterService and give the nvidia-aicr MCS
#    `spec.dependsOn: [<that MCS>]` — kcm gates dependents on the
#    dependency reaching state Deployed.
#
# Live delivery verification against the H200 fleet demo environment (kind
# mothership `aicr-mothership` + adopted k0s child `h200-child`) is PENDING:
# on 2026-09-02 the mothership itself was up, but the SSH tunnel used to
# reach the child's API server from outside the lab could not be restored
# (the lab host was unreachable from the verifying environment). The wrapper
# recipe and YAML below were validated to parse and render correctly; a
# Sveltos delivery of this ClusterProfile has not yet been observed. Update
# this note with date + environment once that check has run.
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: aicr-registry-credentials
spec:
  clusterSelector:
    matchLabels:
      gpu-fleet: training          # same label the MultiClusterService selects
  policyRefs:
    - name: aicr-pack-pull-src     # the wrapper Secret created above
      namespace: kcm-system
      kind: Secret
